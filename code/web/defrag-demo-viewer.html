        border: 0.5em solid white;
        padding: 0.5em;

    #blocker {
        position: absolute;

<body class="bg-black">
    <div id="rotator">

        <div id="ui">
            <div

            <div

            ></div>

        <!-- Use Tailwind classes for the drop area -->
        <div
            id="drop-area"
            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-80 h-52 border-2 border-dashed border-quakered rounded flex flex-col items-center justify-center text-quakered text-center p-5 z-10"

<script src="compression-streams-polyfill.0.1.7.js"></script>
<script type="module">
    let defragMapCache = new Map();
    let currentDemo = null;
    let module = null;
    let buildPath = ".";
    let mapDownloader = null;

    // Override pointer lock
    const originalRequestPointerLock = HTMLElement.prototype.requestPointerLock;
    HTMLElement.prototype.originalRequestPointerLock =
        originalRequestPointerLock;
    HTMLElement.prototype.requestPointerLock = function (options) {
        console.log("Intercepted requestPointerLock call");
    };

    // File upload handling
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("file-input");
    const selectFileButton = document.getElementById("select-file");
    const mapInfo = document.getElementById("map-info");
    const downloadProgress = document.getElementById("download-progress");
    const progressContainer = document.getElementById("progress-container");
    const progressBar = document.getElementById("progress-bar");

    // Drag and drop handling
    ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ["dragenter", "dragover"].forEach((eventName) => {
        dropArea.addEventListener(eventName, highlight, false);
    });

    ["dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
        dropArea.classList.add("border-white", "bg-quakered/20");
        dropArea.classList.remove("border-quakered");
    }

    function unhighlight() {
        dropArea.classList.remove("border-white", "bg-quakered/20");
        dropArea.classList.add("border-quakered");
    }

    // Set up progress display functions
    function showProgress(message = "") {
        progressContainer.style.display = "block";
        progressBar.style.transform = "scaleX(0.05)";
        if (message) {
            downloadProgress.textContent = message;
            downloadProgress.style.display = "block";
        }
    }

    function updateProgress(percent) {
        progressBar.style.transform = `scaleX(${0.05 + percent * 0.95})`;
    }

    function hideProgress() {
        progressContainer.style.display = "none";
        downloadProgress.style.display = "none";
    }

    dropArea.addEventListener("drop", handleDrop, false);
    fileInput.addEventListener("change", handleFiles, false);
    selectFileButton.addEventListener("click", () => fileInput.click(), false);

    async function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        await handleFiles({ target: { files } });
    }

    async function handleFiles(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Show loading indicator
        showProgress("Reading demo file...");

        currentDemo = await readFile(file);
        const demoInfo = parseDemoInfo(currentDemo);

        if (!demoInfo) {
            alert("Invalid or unsupported demo file");
            hideProgress();
            return;
        }

        mapInfo.textContent = `Map: ${demoInfo.mapName}`;

        // Hide the drop area
        dropArea.style.display = "none";

        // First download the map
        showProgress(`Downloading map: ${demoInfo.mapName}`);

        try {
            const mapData = await mapDownloader.downloadMap(demoInfo.mapName);

            showProgress("Initializing Quake 3 engine...");
            await initializeIOQuake3(
                demoInfo.mapName,
                mapData,
                file.name,
                currentDemo,
            );
        } catch (error) {
            console.error("Error loading demo:", error);
            alert(`Failed to load: ${error.message}`);
            hideProgress();

            // Show drop area again if there was an error
            dropArea.style.display = "flex";
        }
    }

    function readFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(new Uint8Array(e.target.result));
            reader.readAsArrayBuffer(file);
        });
    }

    // Now use this in your parseDemoInfo function
    function parseDemoInfo(demoData) {
        return {
            mapName: "hgb-tutte-vs-frutty",
            protocol: 68,
        };
    }

    // Function to load file from server
    function downloadDataFile(mod, url, destPath) {
        return new Promise((resolve, reject) => {
            console.log(`Loading file: ${url} -> ${destPath}`);

            const xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.responseType = "arraybuffer";

            xhr.onload = function () {
                if (xhr.status === 200) {
                    try {
                        const arrayBuffer = xhr.response;
                        const uint8Array = new Uint8Array(arrayBuffer);

                        // Ensure directory exists
                        const dir = destPath.substring(
                            0,
                            destPath.lastIndexOf("/"),
                        );
                        mod.FS.mkdirTree(dir);

                        // Write file
                        mod.FS.writeFile(destPath, uint8Array);
                        console.log(
                            `File loaded successfully: ${destPath} (${uint8Array.length} bytes)`,
                        );
                        resolve();
                    } catch (err) {
                        console.error(`Error writing file ${destPath}:`, err);
                        reject(err);
                    }
                } else {
                    console.warn(`Failed to load ${url}: ${xhr.status}`);
                    reject(new Error(`HTTP status ${xhr.status}`));
                }
            };

            xhr.onerror = function () {
                console.error(`Network error loading ${url}`);
                reject(new Error("Network error"));
            };

            xhr.send();
        });
    }

    async function initializeIOQuake3(mapName, mapData, demoName, demoBytes) {
        let generatedArguments = `+set fs_game defrag +set developer 1 +set logfile 2 +set com_zoneMegs 32 +demo ${demoName}`;

        // Import the ioquake3 module
        const ioquake3 = await import(`./ioquake3_opengl2.wasm32.js`);

        console.log("args", generatedArguments.trim().split(/\s+/));
        // Create module configuration
        const moduleConfig = {
            canvas: canvas,
            arguments: generatedArguments.trim().split(/\s+/),
            locateFile: (file) => `./${file}`,
            printErr: (msg) => {
                if (msg === "--- Common Initialization Complete ---") {
                    hideProgress();
                }
                console.log(msg);
            },
            noFSInit: false,
            preRun: [
                function (mod) {
                    console.log("Setting up Quake 3 filesystem");
                    // Helper function to safely create a directory
                    function safelyCreateDir(path) {
                        try {
                            mod.FS.mkdir(path);
                            console.log(`Created directory: ${path}`);
                        } catch (err) {
                            // EEXIST error means directory already exists, which is fine
                            if (err.code === "EEXIST") {
                                console.log(
                                    `Directory already exists: ${path}`,
                                );
                            } else {
                                console.error(
                                    `Error creating directory ${path}:`,
                                    err,
                                );
                                throw err; // Re-throw if it's a serious error
                            }
                        }
                    }

                    // Create directories for our content
                    safelyCreateDir("/baseq3");
                    safelyCreateDir("/defrag");

                    console.log("Downloading files");
                    showProgress("Loading game files...");

                    // List of PK3 files to load
                    const filesToLoad = [
                        {
                            url: "defrag/zz-defrag_fix_mapscripts_190.pk3",
                            dest: "/defrag/zz-defrag_fix_mapscripts_190.pk3",
                        },
                        {
                            url: "defrag/zz-defrag_fix_shaders_190.pk3",
                            dest: "/defrag/zz-defrag_fix_shaders_190.pk3",
                        },
                        {
                            url: "defrag/zz-defrag_media_190.pk3",
                            dest: "/defrag/zz-defrag_media_190.pk3",
                        },
                        {
                            url: "defrag/zz-defrag_media_191.pk3",
                            dest: "/defrag/zz-defrag_media_191.pk3",
                        },
                        {
                            url: "defrag/zz-defrag_vm_191.pk3",
                            dest: "/defrag/zz-defrag_vm_191.pk3",
                        },
                        {
                            url: "defrag/zzz-nade_flashing_green.pk3",
                            dest: "/defrag/zzz-nade_flashing_green.pk3",
                        },
                        {
                            url: "defrag/zzz-no_teleport_effect.pk3",
                            dest: "/defrag/zzz-no_teleport_effect.pk3",
                        },
                        {
                            url: "defrag/zzz-standard_fonts_big_resolution.pk3",
                            dest: "/defrag/zzz-standard_fonts_big_resolution.pk3",
                        },
                        {
                            url: "defrag/zzz-transparent_lagometer.pk3",
                            dest: "/defrag/zzz-transparent_lagometer.pk3",
                        },
                        {
                            url: "defrag/zzz-trigger-clip-clean-brush.pk3",
                            dest: "/defrag/zzz-trigger-clip-clean-brush.pk3",
                        },
                        {
                            url: "baseq3/q3key",
                            dest: "/baseq3/q3key",
                        },
                        {
                            url: "baseq3/default.cfg",
                            dest: "/baseq3/default.cfg",
                        },
                        {
                            url: "baseq3/pak0.pk3",
                            dest: "/baseq3/pak0.pk3",
                        },
                        {
                            url: "baseq3/pak1.pk3",
                            dest: "/baseq3/pak1.pk3",
                        },
                        {
                            url: "baseq3/pak2.pk3",
                            dest: "/baseq3/pak2.pk3",
                        },
                        {
                            url: "baseq3/pak3.pk3",
                            dest: "/baseq3/pak3.pk3",
                        },
                        {
                            url: "baseq3/pak4.pk3",
                            dest: "/baseq3/pak4.pk3",
                        },
                        {
                            url: "baseq3/pak5.pk3",
                            dest: "/baseq3/pak5.pk3",
                        },
                        {
                            url: "baseq3/pak6.pk3",
                            dest: "/baseq3/pak6.pk3",
                        },
                        {
                            url: "baseq3/pak7.pk3",
                            dest: "/baseq3/pak7.pk3",
                        },
                        {
                            url: "baseq3/pak8.pk3",
                            dest: "/baseq3/pak8.pk3",
                        },
                        {
                            url: "baseq3/q3config.cfg",
                            dest: "/baseq3/q3config.cfg",
                        },
                        {
                            url: "baseq3/zz-q3netpack.pk3",
                            dest: "/baseq3/zz-q3netpack.pk3",
                        },
                        {
                            url: "baseq3/zzz-safe-textures.pk3",
                            dest: "/baseq3/zzz-safe-textures.pk3",
                        },
                    ];

                    mod.addRunDependency("load-game-files");

                    // Create a counter to track loading progress
                    let loadedCount = 0;
                    const totalFiles = filesToLoad.length;

                    // Load each file, but don't wait for all files to finish
                    // This allows the game to run with partial content if some files fail to load
                    const promiseArr = filesToLoad.map((file) =>
                        downloadDataFile(mod, file.url, file.dest)
                            .then(() => {
                                loadedCount++;
                                const percentComplete =
                                    loadedCount / totalFiles;
                                updateProgress(percentComplete * 0.8); // Use 80% of the progress bar for files
                                downloadProgress.textContent = `Loading files: ${Math.round(percentComplete * 100)}%`;
                            })
                            .catch((err) => {
                                console.warn(
                                    `Warning: Could not load ${file.url}: ${err}`,
                                );
                                // Continue despite errors in individual files
                                loadedCount++;
                            }),
                    );

                    // After all files have been processed (or failed)
                    Promise.all(promiseArr).then(() => {
                        console.log("Game file loading complete");
                        mod.removeRunDependency("load-game-files");
                        updateProgress(0.9); // 90% complete after files are loaded
                        downloadProgress.textContent = "Starting engine...";
                    });

                    // Write the demo
                    console.log(`Writing demo to filesystem: ${demoName}`);
                    mod.FS.mkdirTree("/defrag/demos");
                    mod.FS.writeFile(`/defrag/demos/${demoName}`, demoBytes);

                    console.log(`Writing map data: ${mapName}`);
                    mod.FS.writeFile(`/defrag/${mapName}.pk3`, mapData);

                    console.log("Filesystem setup complete in preRun");
                },
            ],
        };

        console.log("Initializing ioquake3 module...");
        module = await ioquake3.default(moduleConfig);
        console.log("ioquake3 module initialized");

        return module;
    }

    // Map downloader functionality
    class MapDownloader {
        constructor() {
            this.repositories = ["http://localhost:8000/maps/"];
        }

        async downloadMap(mapName) {
            let lastError = null;

            for (const repo of this.repositories) {
                try {
                    const url = `${repo}${mapName}.pk3`;
                    downloadProgress.textContent = `Trying: ${url}`;
                    console.log(`Trying: ${url}`);

                    const response = await fetch(url);
                    console.log(response);
                    if (!response.ok) {
                        throw new Error(
                            `Failed to download from ${repo}: ${response.status}`,
                        );
                    }
                    console.log("Map download successful");

                    const contentLength =
                        +response.headers.get("Content-Length") || 1000000;
                    const reader = response.body.getReader();
                    const chunks = [];
                    let receivedLength = 0;

                    while (true) {
                        const { done, value } = await reader.read();

                        if (done) {
                            break;
                        }

                        chunks.push(value);
                        receivedLength += value.length;

                        // Update progress
                        const percentComplete = contentLength
                            ? receivedLength / contentLength
                            : 0;
                        updateProgress(percentComplete * 0.3); // Use 30% of progress bar for map download
                        downloadProgress.textContent = `Downloading map: ${Math.round(percentComplete * 100)}%`;
                    }

                    const mapData = new Uint8Array(receivedLength);
                    let position = 0;
                    for (const chunk of chunks) {
                        mapData.set(chunk, position);
                        position += chunk.length;
                    }

                    return mapData;
                } catch (e) {
                    console.warn(`Failed to download from ${repo}:`, e);
                    lastError = e;
                }
            }

            throw lastError || new Error(`Failed to download map: ${mapName}`);
        }
    }

    // Initialize the map downloader
    mapDownloader = new MapDownloader();

    // Hide progress initially
    hideProgress();
</script>
