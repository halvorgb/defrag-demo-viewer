<!doctype html>

<title>Quake 3: Defrag Demo Viewer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&display=swap"

/>

<style>
    canvas {
        max-width: 100%;
        max-height: 100%;
        min-width: 100%;
        min-height: 100%;
        object-fit: contain;

        image-rendering: optimizeSpeed; /* Older versions of FF */
        image-rendering: -moz-crisp-edges; /* FF 6.0+ */
        image-rendering: -webkit-optimize-contrast; /* Safari */
        image-rendering: -o-crisp-edges; /* Opera 12.0+ */
        image-rendering: pixelated; /* Chrome */
        -ms-interpolation-mode: nearest-neighbor; /* IE */

        /* Prevent tearing/interlacing */
        backface-visibility: hidden;
        transform: translateZ(0);
    }
</style>

<body
    class="bg-zinc-950 overflow-hidden m-0 p-0 font-antonio font-bold leading-tight"
>
    <div id="rotator" class="relative w-full h-screen">
        <canvas id="canvas"></canvas>

        <div
            id="blocker"
            class="absolute inset-0 bg-transparent text-white select-none"
        ></div>

        <div
            id="ui"
            class="absolute left-0 top-0 p-4 text-red-500 select-none z-20 w-full"
        >
            <div
                id="map-info"
                class="text-red-500 text-lg font-bold mb-2"
            ></div>
            <div id="download-progress" class="text-red-500 text-sm"></div>
        </div>
        <div
            id="drop-area"
            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-80 h-52 border-2 border-dashed border-red-500 rounded flex flex-col items-center justify-center text-red-500 text-center p-5 z-10"
        >
            <p>Drop your Defrag demo file here</p>
            <p>or</p>
            <button
                id="select-file"
                class="font-antonio font-bold py-2 px-4 text-red-500 bg-transparent border border-red-500/50 rounded-md hover:text-white hover:bg-red-500/20 hover:border-red-500 transition-all duration-200 shadow-sm"
            >
                Select demo file
            </button>
            <input
                type="file"
                id="file-input"
                accept=".dm_68,.dm_66,.dm_67,.dm_73"
                class="hidden"
            />
        </div>

        <div
            id="progress-container"
            class="hidden absolute inset-0 m-auto w-4/5 h-16 bg-black border-4 border-red-700 p-2"
        >
            <div
                id="progress-bar"
                class="w-full h-full bg-red-500"
                style="
                    transform: scaleX(0.05);
                    transform-origin: center left;
                    transition: transform 0.3s;
                "
            ></div>
        </div>
    </div>
</body>
<script src="compression-streams-polyfill.0.1.7.js"></script>

<script type="module">
    import { DemoParser } from "./demo-parser-browser.js";

    // Override pointer lock
    const originalRequestPointerLock = HTMLElement.prototype.requestPointerLock;
    HTMLElement.prototype.originalRequestPointerLock =
        originalRequestPointerLock;
    HTMLElement.prototype.requestPointerLock = function (options) {
        console.log("Intercepted requestPointerLock call");
    };

    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("file-input");
    const selectFileButton = document.getElementById("select-file");
    const mapInfo = document.getElementById("map-info");
    const downloadProgress = document.getElementById("download-progress");
    const progressContainer = document.getElementById("progress-container");
    const progressBar = document.getElementById("progress-bar");

    // Drag and drop handling
    ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ["dragenter", "dragover"].forEach((eventName) => {
        dropArea.addEventListener(eventName, highlight, false);
    });

    ["dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
        dropArea.classList.add("border-white", "bg-red-500/20");
        dropArea.classList.remove("border-red-500");
    }

    function unhighlight() {
        dropArea.classList.remove("border-white", "bg-red-500/20");
        dropArea.classList.add("border-red-500");
    }

    // Set up progress display functions
    function showProgress(message = "") {
        progressContainer.classList.remove("hidden");
        progressContainer.classList.add("block");
        progressBar.style.transform = "scaleX(0.05)";
        if (message) {
            downloadProgress.textContent = message;
            downloadProgress.classList.remove("hidden");
            downloadProgress.classList.add("block");
        }
    }

    function updateProgress(percent) {
        progressBar.style.transform = `scaleX(${0.05 + percent * 0.95})`;
    }

    function hideProgress() {
        progressContainer.classList.remove("block");
        progressContainer.classList.add("hidden");
        downloadProgress.classList.remove("block");
        downloadProgress.classList.add("hidden");
    }

    dropArea.addEventListener("drop", handleDrop, false);
    fileInput.addEventListener("change", handleFiles, false);
    selectFileButton.addEventListener("click", () => fileInput.click(), false);

    async function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        await handleFiles({ target: { files } });
    }

    async function handleFiles(e) {
        const file = e.target.files[0];
        if (!file) return;

        showProgress("Reading demo file...");

        currentDemo = await readFile(file);
        const demoInfo = parseDemoInfo(currentDemo);

        if (!demoInfo) {
            alert("Invalid or unsupported demo file");
            hideProgress();
            return;
        }

        mapInfo.textContent = `Map: ${demoInfo.mapName}`;

        // Hide the drop area
        dropArea.style.display = "none";

        // First download the map
        showProgress(`Downloading map: ${demoInfo.mapName}`);

        try {
            const mapData = await mapDownloader.downloadMap(demoInfo.mapName);

            showProgress("Initializing Quake 3 engine...");
            await initializeIOQuake3(
                demoInfo.mapName,
                mapData,
                file.name,
                currentDemo,
            );
        } catch (error) {
            console.error("Error loading demo:", error);
            alert(`Failed to load: ${error.message}`);
            hideProgress();

            // Show drop area again if there was an error
            dropArea.style.display = "flex";
        }
    }

    function readFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(new Uint8Array(e.target.result));
            reader.readAsArrayBuffer(file);
        });
    }

    function parseDemoInfo(demoData) {
        try {
            const parser = new DemoParser();
            const demoInfo = parser.parseDemo(demoData);

            if (!demoInfo) {
                console.error("Failed to parse demo info");
                return null;
            }

            console.log("Parsed demo info:", demoInfo);

            // Return the map name from the game info
            console.log("client", demoInfo.client);
            console.log("client.mapname", demoInfo.client.mapname);
            return {
                mapName: demoInfo.client.mapname,
            };
        } catch (error) {
            console.error("Error parsing demo file:", error);
            return null;
        }
    }

    function downloadDataFile(mod, url, destPath) {
        return new Promise((resolve, reject) => {
            console.log(`Loading file: ${url} -> ${destPath}`);

            const xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.responseType = "arraybuffer";

            xhr.onload = function () {
                if (xhr.status === 200) {
                    try {
                        const arrayBuffer = xhr.response;
                        const uint8Array = new Uint8Array(arrayBuffer);

                        // Ensure directory exists
                        const dir = destPath.substring(
                            0,
                            destPath.lastIndexOf("/"),
                        );
                        mod.FS.mkdirTree(dir);

                        mod.FS.writeFile(destPath, uint8Array);
                        console.log(
                            `File loaded successfully: ${destPath} (${uint8Array.length} bytes)`,
                        );
                        resolve();
                    } catch (err) {
                        console.error(`Error writing file ${destPath}:`, err);
                        reject(err);
                    }
                } else {
                    console.warn(`Failed to load ${url}: ${xhr.status}`);
                    reject(new Error(`HTTP status ${xhr.status}`));
                }
            };

            xhr.onerror = function () {
                console.error(`Network error loading ${url}`);
                reject(new Error("Network error"));
            };

            xhr.send();
        });
    }

    function safelyCreateDir(mod, path) {
        try {
            mod.FS.mkdir(path);
            console.log(`Created directory: ${path}`);
        } catch (err) {
            // EEXIST error means directory already exists, which is fine
            if (err.code === "EEXIST") {
                console.log(`Directory already exists: ${path}`);
            } else {
                console.error(`Error creating directory ${path}:`, err);
                throw err; // Re-throw if it's a serious error
            }
        }
    }

    async function initializeIOQuake3(mapName, mapData, demoName, demoBytes) {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        const canvas = document.getElementById("canvas");
        canvas.width = viewportWidth;
        canvas.height = viewportHeight;

        let generatedArguments = `+set r_finish 1 +set fs_game defrag +set developer 1 +set r_customwidth ${viewportWidth} +set r_customheight ${viewportHeight} +set r_mode -1 +set r_fullscreen 0 +demo ${demoName}`;

        const ioquake3 = await import(`./ioquake3_opengl2.wasm32.js`);

        console.log("args", generatedArguments.trim().split(/\s+/));
        const moduleConfig = {
            canvas: canvas,
            arguments: generatedArguments.trim().split(/\s+/),
            locateFile: (file) => `./${file}`,
            printErr: (msg) => {
                if (msg === "--- Common Initialization Complete ---") {
                    hideProgress();
                }
                console.log(msg);
            },
            noFSInit: false,
            preRun: [
                function (mod) {
                    console.log("Setting up Quake 3 filesystem");
                    safelyCreateDir(mod, "/baseq3");
                    safelyCreateDir(mod, "/defrag");

                    console.log("Downloading files");
                    showProgress("Loading game files...");

                    mod.addRunDependency("load-game-files");

                    // Create a counter to track loading progress
                    let loadedCount = 0;
                    const totalFiles = filesToLoad.length;

                    // Load each file, but don't wait for all files to finish
                    // This allows the game to run with partial content if some files fail to load
                    const promiseArr = filesToLoad.map((file) =>
                        downloadDataFile(mod, file.url, file.dest)
                            .then(() => {
                                loadedCount++;
                                const percentComplete =
                                    loadedCount / totalFiles;
                                updateProgress(percentComplete * 0.8); // Use 80% of the progress bar for files
                                downloadProgress.textContent = `Loading files: ${Math.round(percentComplete * 100)}%`;
                            })
                            .catch((err) => {
                                console.warn(
                                    `Warning: Could not load ${file.url}: ${err}`,
                                );
                                // Continue despite errors in individual files
                                loadedCount++;
                            }),
                    );

                    // After all files have been processed (or failed)
                    Promise.all(promiseArr).then(() => {
                        console.log("Game file loading complete");
                        mod.removeRunDependency("load-game-files");
                        updateProgress(0.9); // 90% complete after files are loaded
                        downloadProgress.textContent = "Starting engine...";
                    });

                    console.log(`Writing demo to filesystem: ${demoName}`);
                    mod.FS.mkdirTree("/defrag/demos");
                    mod.FS.writeFile(`/defrag/demos/${demoName}`, demoBytes);

                    console.log(`Writing map data: ${mapName}`);
                    mod.FS.writeFile(`/defrag/${mapName}.pk3`, mapData);

                    console.log("Filesystem setup complete in preRun");
                },
            ],
        };

        console.log("Initializing ioquake3 module...");
        module = await ioquake3.default(moduleConfig);
        console.log("ioquake3 module initialized");

        return module;
    }

    class MapCache {
        constructor() {
            this.dbName = "quake3-maps-cache";
            this.storeName = "maps";
            this.db = null;
            this.initPromise = this.initDatabase();
        }

        async initDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(this.dbName, 1);

                request.onerror = (event) => {
                    console.error("IndexedDB error:", event.target.error);
                    reject(new Error("Failed to open map cache database"));
                };

                request.onsuccess = (event) => {
                    this.db = event.target.result;
                    resolve();
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(this.storeName)) {
                        db.createObjectStore(this.storeName, {
                            keyPath: "mapName",
                        });
                    }
                };
            });
        }

        async getMap(mapName) {
            await this.initPromise;

            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction(
                    [this.storeName],
                    "readonly",
                );
                const store = transaction.objectStore(this.storeName);
                const request = store.get(mapName);

                request.onsuccess = (event) => {
                    const result = event.target.result;
                    if (result) {
                        console.log(`Map ${mapName} loaded from cache`);
                        resolve(result.data);
                    } else {
                        resolve(null); // Map not in cache
                    }
                };

                request.onerror = (event) => {
                    console.error(
                        "Error reading from cache:",
                        event.target.error,
                    );
                    reject(event.target.error);
                };
            });
        }

        async saveMap(mapName, mapData) {
            await this.initPromise;

            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction(
                    [this.storeName],
                    "readwrite",
                );
                const store = transaction.objectStore(this.storeName);

                // Store map with metadata
                const record = {
                    mapName: mapName,
                    data: mapData,
                    timestamp: Date.now(),
                };

                const request = store.put(record);

                request.onsuccess = () => {
                    console.log(
                        `Map ${mapName} saved to cache (${mapData.byteLength} bytes)`,
                    );
                    resolve();
                };

                request.onerror = (event) => {
                    console.error(
                        "Error writing to cache:",
                        event.target.error,
                    );
                    reject(event.target.error);
                };
            });
        }

        async clearCache() {
            await this.initPromise;

            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction(
                    [this.storeName],
                    "readwrite",
                );
                const store = transaction.objectStore(this.storeName);
                const request = store.clear();

                request.onsuccess = () => {
                    console.log("Map cache cleared");
                    resolve();
                };

                request.onerror = (event) => {
                    console.error("Error clearing cache:", event.target.error);
                    reject(event.target.error);
                };
            });
        }
    }

    class MapDownloader {
        constructor() {
            this.repositories = ["http://localhost:8000/maps/"];
            this.cache = new MapCache();
        }

        async downloadMap(mapName) {
            // First try to get the map from cache
            try {
                const cachedMap = await this.cache.getMap(mapName);
                if (cachedMap) {
                    downloadProgress.textContent = `Loaded map ${mapName} from cache`;
                    return cachedMap;
                }
            } catch (cacheError) {
                console.warn(
                    "Cache access failed, will download map:",
                    cacheError,
                );
            }

            // If not in cache, download from repositories
            let lastError = null;

            for (const repo of this.repositories) {
                try {
                    const url = `${repo}${mapName}.pk3`;
                    downloadProgress.textContent = `Trying: ${url}`;
                    console.log(`Trying: ${url}`);

                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(
                            `Failed to download from ${repo}: ${response.status}`,
                        );
                    }
                    console.log("Map download successful");

                    const contentLength =
                        +response.headers.get("Content-Length") || 1000000;
                    const reader = response.body.getReader();
                    const chunks = [];
                    let receivedLength = 0;

                    while (true) {
                        const { done, value } = await reader.read();

                        if (done) {
                            break;
                        }

                        chunks.push(value);
                        receivedLength += value.length;

                        const percentComplete = contentLength
                            ? receivedLength / contentLength
                            : 0;
                        updateProgress(percentComplete * 0.3); // Use 30% of progress bar for map download
                        downloadProgress.textContent = `Downloading map: ${Math.round(percentComplete * 100)}%`;
                    }

                    const mapData = new Uint8Array(receivedLength);
                    let position = 0;
                    for (const chunk of chunks) {
                        mapData.set(chunk, position);
                        position += chunk.length;
                    }

                    // Store the downloaded map in cache
                    try {
                        await this.cache.saveMap(mapName, mapData);
                    } catch (saveCacheError) {
                        console.warn("Failed to cache map:", saveCacheError);
                    }

                    return mapData;
                } catch (e) {
                    console.warn(`Failed to download from ${repo}:`, e);
                    lastError = e;
                }
            }

            throw lastError || new Error(`Failed to download map: ${mapName}`);
        }
    }

    mapDownloader = new MapDownloader();

    // Hide progress initially
    hideProgress();
</script>
